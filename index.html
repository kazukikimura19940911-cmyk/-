<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKY RUN — 飛行機ゲーム</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#081525;color:#edf8ff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}main{width:min(960px,100%);padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px;letter-spacing:5px;margin:0}small{color:#8eaec6}#score{font-size:22px;color:#ffd578} .stage{position:relative;margin-top:20px;border:1px solid #345775;border-radius:22px;overflow:hidden;background:#163c60}canvas{display:block;width:100%;aspect-ratio:16/10;touch-action:none}#overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#081525a8;padding:20px}h2{font-size:clamp(25px,5vw,44px);margin:10px}p{line-height:1.8;color:#c3d9e9}button{background:#ffd578;color:#172435;border:0;border-radius:50px;padding:16px 32px;font-size:18px;font-weight:700;cursor:pointer}footer{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:#8eaec6;margin-top:16px}#pause{padding:8px 16px;font-size:13px;background:#25435e;color:white}button:focus-visible{outline:3px solid white;outline-offset:3px}
</style>
<main><header><div><small>空の冒険へ、出発。</small><h1>SKY RUN</h1></div><div id="score" aria-live="off">★ 0</div></header><div class="stage"><canvas id="game" width="960" height="600" aria-label="星を集めて赤い気球を避ける飛行機ゲーム"></canvas><div id="overlay"><small>READY FOR TAKEOFF</small><h2 id="title">空を飛ぼう！</h2><p id="message">星を集めて、赤い気球をよけよう。<br>矢印キー / WASD、スマホは指で操作</p><button id="start">飛び立つ →</button></div></div><footer><span>★ 星は +10点 · 気球に当たるとゲーム終了</span><button id="pause">一時停止</button></footer></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),scoreLabel=document.querySelector('#score'),pauseButton=document.querySelector('#pause');
let state='ready',score=0,time=0,spawn=0,objects=[],last=0,player={x:160,y:300},keys=new Set(),target=null;
let best=0;try{best=Number(localStorage.getItem('sky-best'))||0}catch{}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function start(){state='playing';score=0;time=0;spawn=0;objects=[];player={x:160,y:300};keys.clear();target=null;overlay.style.display='none';pauseButton.textContent='一時停止';scoreLabel.textContent='★ 0'}
function end(){state='over';best=Math.max(best,Math.floor(score));try{localStorage.setItem('sky-best',best)}catch{}document.querySelector('#title').textContent='ナイスフライト！';document.querySelector('#message').textContent=`スコア ${Math.floor(score)}点 / ベスト ${best}点`;document.querySelector('#start').textContent='もう一度飛ぶ →';overlay.style.display='grid'}
function pause(){if(state==='playing'){state='paused';pauseButton.textContent='再開'}else if(state==='paused'){state='playing';pauseButton.textContent='一時停止'}}
document.querySelector('#start').onclick=start;pauseButton.onclick=pause;
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());if(e.code==='Space'&&!e.repeat){if(state==='ready'||state==='over')start();else pause()}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();target=null;if(state==='playing')pause()});
function point(e){const r=canvas.getBoundingClientRect();target={x:(e.clientX-r.left)*960/r.width,y:(e.clientY-r.top)*600/r.height}}
canvas.addEventListener('pointerdown',e=>{if(state==='playing'){canvas.setPointerCapture(e.pointerId);point(e)}});canvas.addEventListener('pointermove',e=>{if(canvas.hasPointerCapture(e.pointerId))point(e)});for(const event of ['pointerup','pointercancel'])canvas.addEventListener(event,()=>target=null);
function star(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#ffd578';ctx.beginPath();for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,r=i%2?10:22;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}
function draw(){const g=ctx.createLinearGradient(0,0,0,600);g.addColorStop(0,'#123553');g.addColorStop(1,'#287795');ctx.fillStyle=g;ctx.fillRect(0,0,960,600);for(let i=0;i<8;i++){const x=((i*173-time*25)%1250+1250)%1250-140,y=70+(i*97)%470;ctx.fillStyle='#ffffff10';ctx.beginPath();ctx.ellipse(x,y,90,23,0,0,Math.PI*2);ctx.fill()}
for(const o of objects){if(o.kind==='star')star(o.x,o.y);else{ctx.strokeStyle='#ead5be';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(o.x-15,o.y+20);ctx.lineTo(o.x-8,o.y+47);ctx.lineTo(o.x+8,o.y+47);ctx.lineTo(o.x+15,o.y+20);ctx.stroke();ctx.fillStyle='#ff756d';ctx.beginPath();ctx.ellipse(o.x,o.y,27,34,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#bd514f';ctx.fillRect(o.x-10,o.y+42,20,12)}}
ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(40,0);ctx.lineTo(-26,-13);ctx.lineTo(-35,-7);ctx.lineTo(-20,0);ctx.lineTo(-35,7);ctx.lineTo(-26,13);ctx.closePath();ctx.fill();ctx.fillStyle='#ffd578';ctx.beginPath();ctx.moveTo(8,-3);ctx.lineTo(-13,-35);ctx.lineTo(-23,-35);ctx.lineTo(-13,0);ctx.lineTo(-23,35);ctx.lineTo(-13,35);ctx.lineTo(8,3);ctx.fill();ctx.fillStyle='#153b58';ctx.beginPath();ctx.ellipse(15,0,9,5,0,0,Math.PI*2);ctx.fill();ctx.restore();if(state==='paused'){ctx.fillStyle='#081525a0';ctx.fillRect(0,0,960,600);ctx.fillStyle='white';ctx.font='bold 36px system-ui';ctx.textAlign='center';ctx.fillText('一時停止 — 再開ボタンで続ける',480,300)}}
function frame(ts){const dt=Math.min((ts-last)/1000||0,.04);last=ts;if(state==='playing'){time+=dt;score+=dt*2;const dx=(keys.has('arrowright')||keys.has('d'))-(keys.has('arrowleft')||keys.has('a')),dy=(keys.has('arrowdown')||keys.has('s'))-(keys.has('arrowup')||keys.has('w'));player.x+=dx*330*dt;player.y+=dy*330*dt;if(target){player.x+=(target.x-player.x)*Math.min(1,dt*9);player.y+=(target.y-player.y)*Math.min(1,dt*9)}player.x=clamp(player.x,40,910);player.y=clamp(player.y,40,550);spawn-=dt;if(spawn<=0){objects.push({x:1000,y:65+Math.random()*455,kind:Math.random()<.45?'star':'balloon'});spawn=Math.max(.38,1-time/110)}for(const o of objects){o.x-=(200+Math.min(time*3,180))*dt;if(Math.hypot(o.x-player.x,o.y-player.y)<(o.kind==='star'?40:45)){if(o.kind==='star'){score+=10;o.x=-100}else{end();break}}}objects=objects.filter(o=>o.x>-60);scoreLabel.textContent=`★ ${Math.floor(score)}`}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
